<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Removed immediate meta-refresh so script can load index.html and preserve SPA routes -->
    <meta name="robots" content="noindex">
    <title>Redirecting...</title>
    <script>
      // Try to serve index.html content so client-side router can handle the route
      (function(){
        try {
          fetch('./index.html').then(function(r){
            if (!r.ok) { window.location.href = './'; return; }
            return r.text();
          }).then(function(html){
            if (!html) return;
            document.open();
            document.write(html);
            document.close();
            // Replace the history entry so app sees the original path
            history.replaceState(null, '', location.pathname + location.search + location.hash);
          }).catch(function(){ window.location.href = './'; });
        } catch(e) { window.location.href = './'; }
      })();
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
